    <style>
        :root {
            --bg-primary: #080B16;
            --bg-secondary: #10162A;
            --accent-cyan: #00D9FF;
            --accent-purple: #8B5CF6;
            --accent-violet: #A855F7;
            --accent-coral: #FF6B81;
            --text-primary: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            max-width: 100vw;
            min-height: 100vh;
        }

        /* Ambient Futuristic Mesh Lighting */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 12% 14%, rgba(0, 217, 255, 0.11) 0%, transparent 40%),
                radial-gradient(circle at 88% 18%, rgba(139, 92, 246, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 50% 92%, rgba(168, 85, 247, 0.09) 0%, transparent 45%),
                linear-gradient(180deg, #080B16 0%, #090D1C 100%);
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;

                linear-gradient(to right, rgba(255, 255, 255, 0.022) 1px, transparent 1px),

            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 90%);
        }

        /* Glassmorphism Panels */

        /* Gradient Typography */
        .gradient-text {

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gradient-text-coral {
            background: linear-gradient(135deg, #FF6B81 0%, #A855F7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Primary OS Buttons */
        .btn-os-primary {
            background: linear-gradient(135deg, #00D9FF 0%, #8B5CF6 100%);

            font-weight: 700;
            border-radius: 12px;
            box-shadow: 0 4px 20px -4px rgba(0, 217, 255, 0.45);
            transition: all 0.2s ease;
        }

        .btn-os-primary:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 8px 26px -4px rgba(139, 92, 246, 0.55);
        }

        .btn-os-primary:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-os-purple {
            background: linear-gradient(135deg, #8B5CF6 0%, #A855F7 100%);
            color: #F8FAFC;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 4px 18px -4px rgba(139, 92, 246, 0.5);
            transition: all 0.2s ease;
        }

        .btn-os-purple:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        /* Active Nav Item Glow */
        .nav-item-active {
            background: linear-gradient(90deg, rgba(0, 217, 255, 0.16) 0%, rgba(139, 92, 246, 0.12) 100%);
            border: 1px solid rgba(0, 217, 255, 0.35);
            color: #F8FAFC;
            box-shadow: 0 0 20px -6px rgba(0, 217, 255, 0.35);
        }

        /* Active Timetable Slot Pulse */
        @keyframes activePulse {
            0%, 100% {
                border-color: rgba(0, 217, 255, 0.8);
                box-shadow: 0 0 18px rgba(0, 217, 255, 0.22);

            50% {

            }

            background: linear-gradient(135deg, rgba(0, 217, 255, 0.13), rgba(139, 92, 246, 0.12));
        }

        /* Smooth View Transition */
        @keyframes viewFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .view-enter {
            animation: viewFadeIn 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Circular SVG Ring Transition */
        .svg-ring-progress {
            transition: stroke-dashoffset 0.45s linear, stroke 0.3s ease;

            border-color: #00D9FF;
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.15);
        }
    </style>
</head>

            if (str === null || str === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function getTodayISO() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function getDateOffsetISO(daysOffset) {
            const d = new Date();
            d.setDate(d.getDate() + daysOffset);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function formatTime12(t24) {
            if (!t24 || !t24.includes(':')) return t24 || '';
            const [h, m] = t24.split(':').map(Number);
            const suffix = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 || 12;
            return `${h12}:${String(m).padStart(2, '0')} ${suffix}`;
        }

        function timeToMinutes(t24) {
            if (!t24 || !t24.includes(':')) return 0;
            const [h, m] = t24.split(':').map(Number);
            return h * 60 + m;
        }

        // Migrate v1 data if found in localStorage
        function loadAndMigrateState() {
            const base = createDefaultState();
            try {
                const existingV2 = localStorage.getItem(STATE_KEY);
                if (existingV2) {
                    const parsed = JSON.parse(existingV2);
                    return {
                        ...base,
                        ...parsed,
                        settings: { ...base.settings, ...(parsed.settings || {}) },
                        streak: { ...base.streak, ...(parsed.streak || {}) },
                        history: { ...base.history, ...(parsed.history || {}) }
                    };
                }

                // Attempt migration from SreejithOS v1 keys
                const legacyKeys = ['sreejith_reddy_command_center_v1', 'sreejithos_data', 'focusflow_data'];
                for (const key of legacyKeys) {
                    const rawLegacy = localStorage.getItem(key);
                    if (rawLegacy) {
                        const old = JSON.parse(rawLegacy);
                        if (Array.isArray(old.timetable) && old.timetable.length) {
                            base.timetable = old.timetable.map((t, idx) => ({
                                id: t.id || `mig_tt_${idx}`,
                                start: t.start || '09:00',
                                end: t.end || '10:00',
                                title: String(t.title || 'Scheduled Block'),
                                category: t.category === 'Study' ? 'Deep Study' : (t.category || 'Deep Study'),
                                recurring: t.recurring !== false
                            }));
                        }
                        if (Array.isArray(old.subjects) && old.subjects.length) {
                            const palette = ['#00D9FF', '#8B5CF6', '#FF6B81', '#10B981'];
                            base.subjects = old.subjects.map((s, idx) => ({
                                id: s.id || `mig_sub_${idx}`,
                                name: String(s.name || 'Subject'),
                                targetHours: Number(s.targetHours) || 2,
                                todayHours: Number(s.completedHours) || 0,
                                totalHours: Number(s.completedHours) || 0,
                                color: palette[idx % palette.length]
                            }));
                        }
                        if (Array.isArray(old.todos) && old.todos.length) {
                            base.todos = old.todos.map((td, idx) => ({
                                id: td.id || `mig_td_${idx}`,
                                title: String(td.text || td.title || 'Task'),
                                priority: ['High', 'Medium', 'Low'].includes(td.priority) ? td.priority : 'Medium',
                                subject: 'General',
                                dueTime: '',
                                completed: Boolean(td.completed),
                                createdAt: getTodayISO()
                            }));
                        }
                        if (typeof old.streak === 'number') {
                            base.streak.current = Math.max(1, old.streak);
                            base.streak.best = Math.max(base.streak.best, old.streak);
                        }
                        base.notifications.unshift({
                            id: 'n_mig',
                            title: 'SreejithOS v1 Data Migrated',
                            desc: 'Your timetable, subjects, tasks, and streak were safely upgraded to v2.0.',
                            time: 'Just now',
                            type: 'cyan',
                            read: false
                        });
                        break;
                    }
                }
            } catch (e) {
                console.warn('Storage load fallback triggered:', e);
            }
            saveState(base);
            return base;
        }

        let state = loadAndMigrateState();

        function saveState(customState = state) {
            try {
                // Keep today's snapshot synced in history
                const today = getTodayISO();
                const metrics = computeDailyMetrics(customState);
                customState.history[today] = {
                    date: today,
                    score: metrics.productivityScore,
                    focusMinutes: metrics.todayFocusMinutes,
                    tasksCompleted: metrics.completedTodos,
                    totalTasks: metrics.totalTodos
                };
                localStorage.setItem(STATE_KEY, JSON.stringify(customState));
            } catch (e) {
                console.error('Failed saving to localStorage:', e);
                showToast('Storage warning: Unable to save changes');
            }
        }

        // =========================================================================
        // 2. LIVE METRICS, XP & PRODUCTIVITY SCORE ENGINE
        // =========================================================================
        function computeDailyMetrics(s = state) {
            const totalTodos = s.todos.length;
            const completedTodos = s.todos.filter(t => t.completed).length;
            const taskRatio = totalTodos > 0 ? completedTodos / totalTodos : 1;

            const totalStudyHoursToday = s.subjects.reduce((acc, sub) => acc + (Number(sub.todayHours) || 0), 0);
            const targetStudyHours = Math.max(0.5, Number(s.settings.dailyStudyGoalHours) || 6);
            const studyRatio = Math.min(1, totalStudyHoursToday / targetStudyHours);

            const todayFocusMinutes = Math.round(totalStudyHoursToday * 60);
            const sessionBonus = Math.min(10, s.focusSessions.filter(fs => fs.timestamp.startsWith(getTodayISO())).length * 3);

            const rawScore = Math.round((taskRatio * 45) + (studyRatio * 45) + sessionBonus);
            const productivityScore = Math.min(100, Math.max(0, rawScore));

            // Compute cumulative XP and OS Level
            const totalCumulativeHours = s.subjects.reduce((acc, sub) => acc + (Number(sub.totalHours) || 0), 0);
            const totalXP = Math.round(totalCumulativeHours * 100 + completedTodos * 25 + s.streak.current * 40);
            const level = Math.max(1, Math.floor(totalXP / 500) + 1);
            const ranks = ['INITIATE', 'OPERATOR', 'STRATEGIST', 'ARCHITECT', 'OVERLORD'];
            const rankTitle = ranks[Math.min(ranks.length - 1, Math.floor((level - 1) / 2))];

            return {
                totalTodos,
                completedTodos,
                pendingTodos: totalTodos - completedTodos,
                taskPercent: totalTodos > 0 ? Math.round((completedTodos / totalTodos) * 100) : 0,
                totalStudyHoursToday,
                targetStudyHours,
                todayFocusMinutes,
                productivityScore,
                totalCumulativeHours,
                totalXP,
                level,
                rankTitle
            };
        }

        // =========================================================================
        // 3. AUDIO CHIME (WEB AUDIO API - ZERO EXTERNAL AUDIO FILES)
        // =========================================================================
        function playOSChime() {
            if (!state.settings.soundEnabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.11);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime + i * 0.11);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.11 + 0.35);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.11);
                    osc.stop(ctx.currentTime + i * 0.11 + 0.36);
                });
            } catch (e) {}
        }

            if (q) {
                state.todos.filter(t => t.title.toLowerCase().includes(q)).forEach(t => {
                    results.push({ badge: 'MISSION', color: '#FF6B81', title: t.title, sub: `Priority: ${t.priority} • ${t.completed ? 'Completed' : 'Active'}`, run: () => switchModule('missions') });
                });
                state.timetable.filter(tt => tt.title.toLowerCase().includes(q)).forEach(tt => {
                    results.push({ badge: 'SCHEDULE', color: '#00D9FF', title: tt.title, sub: `${formatTime12(tt.start)} – ${formatTime12(tt.end)}`, run: () => switchModule('timetable') });
                });
                state.notes.filter(n => n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q)).forEach(n => {
                    results.push({ badge: 'NOTE', color: '#A855F7', title: n.title, sub: n.content.slice(0, 60) + '...', run: () => switchModule('notes') });
                });
            }

            window.__cmdActions = results;

            if (results.length === 0) {
                container.innerHTML = `<p class="text-xs text-[#94A3B8] text-center py-6">No matching commands or records found.</p>`;
                return;
            }

            container.innerHTML = results.slice(0, 12).map((r, idx) => `
                <button onclick="executeCommandResult(${idx})" class="w-full text-left p-2.5 rounded-xl hover:bg-white/[0.06] flex items-center justify-between gap-3 transition">
                    <div class="min-w-0">
                        <p class="text-xs font-semibold text-white truncate">${escapeHTML(r.title)}</p>
                        <p class="text-[11px] text-[#94A3B8] truncate">${escapeHTML(r.sub)}</p>
                    </div>
                    <span class="font-mono text-[10px] font-bold px-2 py-0.5 rounded border shrink-0" style="color:${r.color}; border-color:${r.color}55; background:${r.color}18">${r.badge}</span>
                </button>
            `).join('');
        }

        function executeCommandResult(idx) {
            closeCommandPalette();
            if (window.__cmdActions && window.__cmdActions[idx]) {
                window.__cmdActions[idx].run();
            }
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                openCommandPalette();
            } else if (e.key === 'Escape') {
                closeCommandPalette();
                closeUniversalModal();
                document.getElementById('notification-drawer').classList.add('hidden');
            }
        });

        // =========================================================================
        // 7. FOCUS REACTOR ENGINE (WORKS ACROSS ALL MODULES)
        // =========================================================================
        let reactorSecondsTotal = (state.settings.focusDurationMins || 25) * 60;
        let reactorSecondsLeft = reactorSecondsTotal;
        let reactorModeLabel = 'Deep Focus';
        let reactorRunning = false;
        let reactorInterval = null;
        let selectedReactorSubject = state.subjects[0] ? state.subjects[0].id : '';

        function setReactorPreset(mins, label) {
            pauseReactor();
            reactorModeLabel = label;
            reactorSecondsTotal = mins * 60;
            reactorSecondsLeft = reactorSecondsTotal;
            if (state.activeModule === 'focus' || state.activeModule === 'dashboard') {
                renderActiveModule();
            }
        }

        function toggleReactor() {
            if (reactorRunning) pauseReactor();
            else startReactor();
        }

        function startReactor() {
            if (reactorRunning) return;
            reactorRunning = true;
            reactorInterval = setInterval(() => {
                if (reactorSecondsLeft > 0) {
                    reactorSecondsLeft--;
                    updateReactorLiveDOM();
                } else {
                    completeReactorCycle();
                }
            }, 1000);
            updateReactorLiveDOM();
        }

        function pauseReactor() {
            reactorRunning = false;
            clearInterval(reactorInterval);
            updateReactorLiveDOM();
        }

        function resetReactor() {
            pauseReactor();
            reactorSecondsLeft = reactorSecondsTotal;
            updateReactorLiveDOM();
        }

        function completeReactorCycle() {
            pauseReactor();
            playOSChime();
            const minsCompleted = Math.round(reactorSecondsTotal / 60);
            const isStudyMode = !reactorModeLabel.toLowerCase().includes('break');

            if (isStudyMode) {
                const subObj = state.subjects.find(s => s.id === selectedReactorSubject) || state.subjects[0];
                const subName = subObj ? subObj.name : 'General Deep Work';
                if (subObj) {
                    const hrs = +(minsCompleted / 60).toFixed(2);
                    subObj.todayHours = +(subObj.todayHours + hrs).toFixed(2);
                    subObj.totalHours = +(subObj.totalHours + hrs).toFixed(2);
                }
                const nowStr = `${getTodayISO()} ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
                state.focusSessions.unshift({
                    id: 'fs_' + Date.now(),
                    subject: subName,
                    minutes: minsCompleted,
                    mode: reactorModeLabel,
                    timestamp: nowStr
                });
                pushNotification('Focus Reactor Completed', `+${minsCompleted}m logged to ${subName}.`, 'cyan');
                showToast(`⚡ +${minsCompleted}m logged to ${subName}!`);
            } else {
                showToast('Break complete! Ready for next focus sprint.');
            }

            reactorSecondsLeft = reactorSecondsTotal;
            saveState();
            renderSidebarNav();
            renderActiveModule();
        }

        function updateReactorLiveDOM() {
            const mins = Math.floor(reactorSecondsLeft / 60);
            const secs = reactorSecondsLeft % 60;
            const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            const disp = document.getElementById('reactor-time-display');
            if (disp) disp.textContent = formatted;

            const miniDisp = document.getElementById('dash-mini-timer');
            if (miniDisp) miniDisp.textContent = formatted;

            const btnText = document.getElementById('reactor-start-label');
            if (btnText) btnText.textContent = reactorRunning ? 'Pause Reactor' : 'Ignite Focus';

            const ring = document.getElementById('reactor-progress-ring');
            if (ring) {
                const circumference = 2 * Math.PI * 84;
                const ratio = reactorSecondsTotal > 0 ? reactorSecondsLeft / reactorSecondsTotal : 1;
                ring.style.strokeDashoffset = circumference * (1 - ratio);
            }
        }

        // =========================================================================
        // 8. MODULE RENDERERS (ALL 9 FULL-FEATURED OS APPS)
        // =========================================================================
        function renderActiveModule() {
            const viewport = document.getElementById('os-viewport');
            if (!viewport) return;

            switch (state.activeModule) {
                case 'dashboard': viewport.innerHTML = renderDashboardView(); break;
                case 'timetable': viewport.innerHTML = renderTimetableView(); break;
                case 'focus': viewport.innerHTML = renderFocusView(); break;
                case 'study': viewport.innerHTML = renderStudyPlanView(); break;
                case 'missions': viewport.innerHTML = renderMissionsView(); break;
                case 'analytics': viewport.innerHTML = renderAnalyticsView(); break;
                case 'calendar': viewport.innerHTML = renderCalendarView(); break;
                case 'notes': viewport.innerHTML = renderNotesView(); break;
                case 'settings': viewport.innerHTML = renderSettingsView(); break;
                default: viewport.innerHTML = renderDashboardView();
            }
            updateReactorLiveDOM();
        }

        // -------------------------------------------------------------------------
        // MODULE 1: COMMAND CENTER (HOME DASHBOARD)
        // -------------------------------------------------------------------------
        function getCurrentActiveSlot() {
            const now = new Date();
            const curMins = now.getHours() * 60 + now.getMinutes();
            const sorted = [...state.timetable].sort((a, b) => a.start.localeCompare(b.start));
            const active = sorted.find(s => curMins >= timeToMinutes(s.start) && curMins < timeToMinutes(s.end));
            const upcoming = sorted.filter(s => timeToMinutes(s.start) > curMins);
            return { active, upcoming, sorted };
        }

        function renderDashboardView() {
            const metrics = computeDailyMetrics();
            const { active, upcoming } = getCurrentActiveSlot();
            const last7Dates = Array.from({ length: 7 }, (_, i) => getDateOffsetISO(i - 6));
            const weekScores = last7Dates.map(d => state.history[d]?.score ?? 50);
            const weekFocus = last7Dates.map(d => +( (state.history[d]?.focusMinutes ?? 60) / 60 ).toFixed(1));
            const dayLabels = last7Dates.map(d => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' }));

            // Build SVG smooth wave coordinates
            const w = 520, h = 150, padX = 24, padY = 20;
            const points = weekScores.map((val, idx) => {
                const x = padX + (idx * ((w - padX * 2) / 6));
                const y = h - padY - ((val / 100) * (h - padY * 2));
                return { x, y, val, label: dayLabels[idx], hrs: weekFocus[idx] };
            });
            const polylineStr = points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
            const areaStr = `${points[0].x},${h - padY} ${polylineStr} ${points[points.length - 1].x},${h - padY}`;

            // Segmented radial gauge for Task Completion
            const arcRadius = 46;
            const arcCirc = Math.PI * arcRadius; // semicircle
            const arcOffset = arcCirc * (1 - metrics.taskPercent / 100);

            const focusH = Math.floor(metrics.todayFocusMinutes / 60);
            const focusM = metrics.todayFocusMinutes % 60;

            return `
            <div class="space-y-6 view-enter">
                <!-- Personalized Hero Banner -->

                    <div>
                        <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-[#8B5CF6]/15 border border-[#8B5CF6]/30 text-[11px] font-mono text-purple-200 mb-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-[#00D9FF]"></span>

                        <h2 class="font-display font-extrabold text-2xl sm:text-3xl tracking-tight">
                            Welcome back, <span class="gradient-text">${escapeHTML(state.settings.userName)}</span>
                        </h2>
                        <p class="text-xs sm:text-sm text-[#94A3B8] mt-1">
                            ${active ? `Currently scheduled: <strong class="text-[#00D9FF]">${escapeHTML(active.title)}</strong> (${formatTime12(active.start)} – ${formatTime12(active.end)})` : 'All clear on your live timeline. Ready for deep execution.'}
                        </p>
                    </div>
                    <!-- Quick Action Buttons -->
                    <div class="flex flex-wrap items-center gap-2.5">
                        <button onclick="switchModule('focus')" class="btn-os-primary min-h-[44px] px-4 py-2.5 text-xs flex items-center gap-2">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            <span id="dash-mini-timer">${reactorRunning ? 'Focus Active' : 'Start Focus'}</span>
                        </button>
                        <button onclick="openTimetableFormModal()" class="min-h-[44px] px-3.5 py-2.5 rounded-xl bg-[#10162A] hover:bg-[#192342] border border-white/[0.1] hover:border-[#00D9FF]/40 text-xs font-semibold text-white transition">
                            + Time Block
                        </button>
                        <button onclick="switchModule('missions')" class="min-h-[44px] px-3.5 py-2.5 rounded-xl bg-[#10162A] hover:bg-[#192342] border border-white/[0.1] hover:border-[#8B5CF6]/40 text-xs font-semibold text-white transition">
                            + Mission
                        </button>
                    </div>
                </div>

                <!-- 4 TOP KPI GLASS CARDS -->
                <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                    <!-- KPI 1: Productivity Score -->
                    <div class="os-card p-5">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-semibold text-[#94A3B8]">Productivity Score</span>
                            <span class="text-[11px] font-mono font-bold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400">+12% wk</span>
                        </div>
                        <div class="flex items-baseline gap-1.5">
                            <span class="font-display font-extrabold text-3xl gradient-text">${metrics.productivityScore}</span>
                            <span class="font-mono text-sm text-[#94A3B8]">/100</span>
                        </div>
                        <div class="w-full h-2 rounded-full bg-[#080B16] mt-4 overflow-hidden border border-white/[0.06]">
                            <div class="h-full rounded-full bg-gradient-to-r from-[#00D9FF] to-[#8B5CF6] transition-all duration-500" style="width:${metrics.productivityScore}%"></div>
                        </div>
                        <p class="text-[11px] text-[#94A3B8] mt-2">Live synthesis of tasks & study goal</p>
                    </div>

                    <!-- KPI 2: Focus Time Today + Mini 7-Day Bars -->
                    <div class="os-card p-5">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-semibold text-[#94A3B8]">Focus Time Today</span>
                            <span class="text-[11px] font-mono text-[#00D9FF]">Goal ${metrics.targetStudyHours}h</span>
                        </div>
                        <div class="font-display font-extrabold text-3xl text-white">${focusH}h ${focusM}m</div>
                        <div class="flex items-end gap-1.5 h-8 mt-3">
                            ${weekFocus.map((hrs, idx) => {
                                const barPct = Math.min(100, Math.max(18, Math.round((hrs / metrics.targetStudyHours) * 100)));
                                const isToday = idx === 6;
                                return `<div title="${dayLabels[idx]}: ${hrs}h" class="flex-1 rounded-t-md ${isToday ? 'bg-gradient-to-t from-[#8B5CF6] to-[#00D9FF]' : 'bg-[#00D9FF]/25'}" style="height:${barPct}%"></div>`;
                            }).join('')}
                        </div>
                    </div>

                    <!-- KPI 3: Mission Completion Semicircle Arc -->
                    <div class="os-card p-5 flex flex-col justify-between">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-semibold text-[#94A3B8]">Mission Completion</span>
                            <span class="text-[11px] font-mono text-purple-300">${metrics.completedTodos}/${metrics.totalTodos}</span>
                        </div>
                        <div class="flex items-center justify-between mt-2">
                            <div>
                                <div class="font-display font-extrabold text-3xl text-white">${metrics.taskPercent}%</div>
                                <p class="text-[11px] text-[#94A3B8] mt-1">${metrics.completedTodos} Done • ${metrics.pendingTodos} Left</p>
                            </div>
                            <svg class="w-24 h-14 overflow-visible" viewBox="0 0 110 60">
                                <path d="M 9 54 A 46 46 0 0 1 101 54" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10" stroke-linecap="round" />
                                <path d="M 9 54 A 46 46 0 0 1 101 54" fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${arcCirc}" stroke-dashoffset="${arcOffset}" />
                                <defs>
                                    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                        <stop offset="0%" stop-color="#00D9FF"/>
                                        <stop offset="100%" stop-color="#8B5CF6"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                        </div>
                    </div>

                    <!-- KPI 4: Study Streak (Coral Accent) -->
                    <div class="os-card p-5">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-semibold text-[#94A3B8]">Execution Streak</span>
                            <span class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-[#FF6B81]/15 text-[#FF6B81] border border-[#FF6B81]/30">ACTIVE</span>
                        </div>
                        <div class="flex items-baseline gap-2">
                            <span class="font-display font-extrabold text-3xl gradient-text-coral">${state.streak.current} Days</span>
                            <span class="font-mono text-xs text-[#94A3B8]">Best: ${state.streak.best}d</span>
                        </div>
                        <p class="text-[11px] text-[#94A3B8] mt-4">Cumulative Study: <strong class="text-white font-mono">${metrics.totalCumulativeHours.toFixed(1)} hrs</strong></p>
                    </div>
                </div>

                <!-- MIDDLE ROW: WEEKLY PRODUCTIVITY WAVE CHART + LIVE TIMETABLE -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- Weekly Productivity Chart (7 Cols) -->
                    <div class="lg:col-span-7 os-card p-5 flex flex-col justify-between">
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                            <div>
                                <h3 class="font-display font-bold text-base text-white">Weekly Productivity Telemetry</h3>
                                <p class="text-xs text-[#94A3B8]">7-day execution score & study momentum</p>
                            </div>
                            <button onclick="switchModule('analytics')" class="text-xs text-[#00D9FF] hover:underline font-semibold">Full Reports &rarr;</button>
                        </div>
                        <div class="w-full overflow-hidden">
                            <svg viewBox="0 0 ${w} ${h}" class="w-full h-44 overflow-visible">
                                <defs>
                                    <linearGradient id="waveArea" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.32"/>
                                        <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.0"/>
                                    </linearGradient>
                                    <linearGradient id="waveStroke" x1="0" y1="0" x2="1" y2="0">
                                        <stop offset="0%" stop-color="#00D9FF"/>
                                        <stop offset="100%" stop-color="#A855F7"/>
                                    </linearGradient>
                                </defs>
                                <!-- Horizontal Gridlines -->
                                ${[25, 50, 75, 100].map(g => {
                                    const gy = h - padY - ((g / 100) * (h - padY * 2));
                                    return `<line x1="${padX}" y1="${gy}" x2="${w - padX}" y2="${gy}" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4 4"/>`;
                                }).join('')}
                                <polygon points="${areaStr}" fill="url(#waveArea)" />
                                <polyline fill="none" stroke="url(#waveStroke)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${polylineStr}" />
                                ${points.map((p, idx) => `
                                    <g>
                                        <circle cx="${p.x}" cy="${p.y}" r="${idx === 6 ? 5.5 : 4}" fill="#080B16" stroke="${idx === 6 ? '#FF6B81' : '#00D9FF'}" stroke-width="2.5">
                                            <title>${p.label}: Score ${p.val}/100 (${p.hrs}h focus)</title>
                                        </circle>
                                        <text x="${p.x}" y="${h - 3}" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="JetBrains Mono">${p.label}</text>
                                    </g>
                                `).join('')}
                            </svg>
                        </div>
                    </div>

                    <!-- Today's Live Timetable Preview (5 Cols) -->
                    <div class="lg:col-span-5 os-card p-5 flex flex-col justify-between">
                        <div class="flex items-center justify-between mb-3">
                            <div>
                                <h3 class="font-display font-bold text-base text-white">Today's Timetable</h3>
                                <p class="text-xs text-[#94A3B8]">Live schedule & upcoming blocks</p>
                            </div>
                            <button onclick="switchModule('timetable')" class="text-xs text-[#00D9FF] hover:underline font-semibold">Manage &rarr;</button>
                        </div>
                        <div class="space-y-2.5 max-h-56 overflow-y-auto pr-1">
                            ${(active ? [active, ...upcoming] : upcoming).slice(0, 4).map((slot, idx) => {
                                const isNow = active && slot.id === active.id;
                                return `
                                    <div class="p-3 rounded-xl border ${isNow ? 'slot-active-now border-[#00D9FF]' : 'bg-[#080B16]/70 border-white/[0.07]'} flex items-center justify-between gap-2">
                                        <div class="min-w-0">
                                            <div class="flex items-center gap-2">
                                                <span class="font-mono text-[11px] ${isNow ? 'text-[#00D9FF] font-bold' : 'text-[#94A3B8]'}">${formatTime12(slot.start)} – ${formatTime12(slot.end)}</span>
                                                ${isNow ? `<span class="text-[9px] font-mono font-extrabold px-1.5 py-0.5 rounded bg-[#00D9FF] text-[#080B16]">ACTIVE NOW</span>` : ''}
                                            </div>
                                            <p class="text-xs font-semibold text-white truncate mt-1">${escapeHTML(slot.title)}</p>
                                        </div>
                                        <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-white/[0.06] text-slate-300 shrink-0">${escapeHTML(slot.category)}</span>
                                    </div>
                                `;
                            }).join('') || `<p class="text-xs text-[#94A3B8] text-center py-8">No more blocks remaining today.</p>`}
                        </div>
                    </div>
                </div>

                <!-- BOTTOM ROW: PRIORITY MISSIONS + SUBJECT PROGRESS -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- Upcoming Missions (6 Cols) -->
                    <div class="lg:col-span-6 os-card p-5">
                        <div class="flex items-center justify-between mb-3.5">
                            <h3 class="font-display font-bold text-base text-white">Priority Daily Missions</h3>
                            <button onclick="switchModule('missions')" class="text-xs text-[#00D9FF] hover:underline font-semibold">All Missions (${state.todos.length}) &rarr;</button>
                        </div>
                        <div class="space-y-2.5">
                            ${state.todos.slice(0, 4).map(t => `
                                <div class="p-3 rounded-xl bg-[#080B16]/75 border border-white/[0.07] flex items-center justify-between gap-3">
                                    <button onclick="toggleMissionComplete('${t.id}')" class="flex items-center gap-3 min-w-0 text-left flex-1">
                                        <span class="w-5 h-5 rounded-md border flex items-center justify-center shrink-0 ${t.completed ? 'bg-[#00D9FF] border-[#00D9FF] text-[#080B16]' : 'border-slate-600'}">
                                            ${t.completed ? '✓' : ''}
                                        </span>
                                        <span class="text-xs font-medium truncate ${t.completed ? 'line-through text-[#94A3B8]' : 'text-white'}">${escapeHTML(t.title)}</span>
                                    </button>
                                    <span class="font-mono text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0 ${getPriorityChipClass(t.priority)}">${escapeHTML(t.priority)}</span>
                                </div>
                            `).join('') || `<p class="text-xs text-[#94A3B8] py-4 text-center">No missions added yet.</p>`}
                        </div>
                    </div>

                    <!-- Study Subjects Progress (6 Cols) -->
                    <div class="lg:col-span-6 os-card p-5">
                        <div class="flex items-center justify-between mb-3.5">
                            <h3 class="font-display font-bold text-base text-white">Subject Target Progress</h3>
                            <button onclick="switchModule('study')" class="text-xs text-[#00D9FF] hover:underline font-semibold">Study Plan &rarr;</button>
                        </div>
                        <div class="space-y-3">
                            ${state.subjects.slice(0, 3).map(sub => {
                                const pct = Math.min(100, Math.round((sub.todayHours / sub.targetHours) * 100));
                                return `
                                    <div class="p-3 rounded-xl bg-[#080B16]/75 border border-white/[0.07]">
                                        <div class="flex items-center justify-between gap-2 text-xs mb-1.5">
                                            <span class="font-semibold text-white truncate">${escapeHTML(sub.name)}</span>
                                            <div class="flex items-center gap-2 shrink-0">
                                                <span class="font-mono text-[#94A3B8]">${sub.todayHours.toFixed(1)}/${sub.targetHours}h</span>
                                                <button onclick="adjustSubjectHours('${sub.id}', 0.5)" class="px-2 py-0.5 rounded bg-[#00D9FF]/15 hover:bg-[#00D9FF]/25 text-[#00D9FF] font-mono text-[11px] font-bold">+30m</button>
                                            </div>
                                        </div>
                                        <div class="w-full h-2 rounded-full bg-[#10162A] overflow-hidden">
                                            <div class="h-full rounded-full transition-all duration-300" style="width:${pct}%; background:${sub.color}"></div>
                                        </div>

                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        // -------------------------------------------------------------------------
        // MODULE 2: DAILY TIMETABLE
        // -------------------------------------------------------------------------
        let timetableFilter = 'All';

        function renderTimetableView() {
            const { active, sorted } = getCurrentActiveSlot();
            const categories = ['All', 'Deep Study', 'Class / Lecture', 'Routine', 'Break', 'Revision'];
            const filtered = timetableFilter === 'All' ? sorted : sorted.filter(s => s.category === timetableFilter);

            return `
            <div class="space-y-6 view-enter">

        function saveTimetableForm(e, editId) {
            e.preventDefault();
            const start = document.getElementById('tt-form-start').value;
            const end = document.getElementById('tt-form-end').value;
            const title = document.getElementById('tt-form-title').value.trim();
            const category = document.getElementById('tt-form-cat').value;
            const recurring = document.getElementById('tt-form-rec').checked;

            if (!title) return;
            if (timeToMinutes(end) <= timeToMinutes(start)) {
                showToast('End time must be after start time');
                return;
            }

            // Overlap check warning
            const overlap = state.timetable.find(s => s.id !== editId && timeToMinutes(start) < timeToMinutes(s.end) && timeToMinutes(end) > timeToMinutes(s.start));
            if (overlap) {
                showToast(`Note: Overlaps with "${overlap.title}"`);
            }

            if (editId) {
                const idx = state.timetable.findIndex(s => s.id === editId);
                if (idx !== -1) state.timetable[idx] = { id: editId, start, end, title, category, recurring };
            } else {
                state.timetable.push({ id: 'tt_' + Date.now(), start, end, title, category, recurring });
            }

            saveState();
            closeUniversalModal();
            renderActiveModule();
            if (!overlap) showToast('Timetable updated');
        }

        function deleteTimetableBlock(id) {
            state.timetable = state.timetable.filter(s => s.id !== id);
            saveState();
            renderActiveModule();
            showToast('Time block deleted');

            sub.todayHours = Math.max(0, +(sub.todayHours + delta).toFixed(2));
            if (delta > 0) sub.totalHours = +(sub.totalHours + delta).toFixed(2);
            if (!prevGoal && sub.todayHours >= sub.targetHours) {
                playOSChime();
                pushNotification('Daily Subject Goal Reached', `Completed ${sub.targetHours}h target for ${sub.name}!`, 'cyan');

        function addNewMission(e) {
            e.preventDefault();
            const titleEl = document.getElementById('mission-title-input');
            const title = titleEl.value.trim();
            const priority = document.getElementById('mission-priority-input').value;
            const subject = document.getElementById('mission-subject-input').value;
            if (!title) return;

            // Duplicate active mission prevention
            if (state.todos.some(t => !t.completed && t.title.toLowerCase() === title.toLowerCase())) {
                showToast('Duplicate active mission prevented');
                return;
            }

            state.todos.unshift({
                id: 'td_' + Date.now(),
                title,
                priority,
                subject,
                dueTime: '',
                completed: false,
                createdAt: getTodayISO()
            });
            saveState();
            renderSidebarNav();
            renderActiveModule();
            showToast('Mission added');
        }

        function toggleMissionComplete(id) {
            const todo = state.todos.find(t => t.id === id);
            if (!todo) return;
            todo.completed = !todo.completed;
            saveState();
            renderSidebarNav();
            renderActiveModule();
        }

        function deleteMission(id) {
            state.todos = state.todos.filter(t => t.id !== id);
            saveState();
            renderSidebarNav();
            renderActiveModule();
        }

        function clearCompletedMissions() {
            state.todos = state.todos.filter(t => !t.completed);
            saveState();
            renderSidebarNav();
            renderActiveModule();
            showToast('Completed missions cleared');
        }

        // -------------------------------------------------------------------------
        // MODULE 6: ANALYTICS & REPORTS (WEEKLY, MONTHLY & BADGES)
        // -------------------------------------------------------------------------
        let analyticsRange = 'weekly';

        function renderAnalyticsView() {
            const metrics = computeDailyMetrics();
            const daysCount = analyticsRange === 'weekly' ? 7 : 30;
            const dateSlice = Array.from({ length: daysCount }, (_, i) => getDateOffsetISO(i - (daysCount - 1)));
            const scores = dateSlice.map(d => state.history[d]?.score ?? (45 + ((d.charCodeAt(9) * 7) % 45)));
            const focusMins = dateSlice.map(d => state.history[d]?.focusMinutes ?? (90 + ((d.charCodeAt(8) * 13) % 140)));

            const avgScore = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
            const totalRangeHours = (focusMins.reduce((a, b) => a + b, 0) / 60).toFixed(1);

            // Subject Distribution Donut
            const totalSubHrs = Math.max(0.1, state.subjects.reduce((acc, s) => acc + s.totalHours, 0));
            let cumulativePct = 0;
            const donutCircumference = 2 * Math.PI * 52;

            // 8 Achievement Badges
            const badges = [
                { name: 'First Ignition', desc: 'Complete 1 Focus Reactor session', unlocked: state.focusSessions.length >= 1, color: '#00D9FF' },
                { name: '7-Day Unstoppable', desc: 'Maintain a 7-day execution streak', unlocked: state.streak.current >= 7 || state.streak.best >= 7, color: '#FF6B81' },
                { name: 'Mission Sweep', desc: 'Achieve 100% daily task completion', unlocked: metrics.totalTodos > 0 && metrics.completedTodos === metrics.totalTodos, color: '#8B5CF6' },
                { name: 'Deep Work Scholar', desc: 'Accumulate 20+ total study hours', unlocked: metrics.totalCumulativeHours >= 20, color: '#00D9FF' },
                { name: 'Time Architect', desc: 'Configure 5+ daily timetable blocks', unlocked: state.timetable.length >= 5, color: '#A855F7' },
                { name: 'Knowledge Vault', desc: 'Store 2+ structured study notes', unlocked: state.notes.length >= 2, color: '#10B981' },
                { name: 'Peak Velocity', desc: 'Hit a 85+ Daily Productivity Score', unlocked: metrics.productivityScore >= 85, color: '#FF6B81' },
                { name: 'Centurion Master', desc: 'Reach 100+ cumulative study hours', unlocked: metrics.totalCumulativeHours >= 100, color: '#00D9FF' }
            ];

            return `
            <div class="space-y-6 view-enter">
                <div class="os-card p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h2 class="font-display font-bold text-xl gradient-text">Performance Analytics & Reports</h2>
                        <p class="text-xs text-[#94A3B8] mt-1">Average Score: <strong class="text-white font-mono">${avgScore}/100</strong> • Period Focus: <strong class="text-[#00D9FF] font-mono">${totalRangeHours} hrs</strong></p>
                    </div>
                    <div class="flex bg-[#080B16] p-1 rounded-xl border border-white/[0.08] self-start sm:self-auto">
                        <button onclick="analyticsRange='weekly'; renderActiveModule();" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${analyticsRange==='weekly' ? 'bg-[#8B5CF6] text-white' : 'text-[#94A3B8] hover:text-white'}">Weekly (7D)</button>
                        <button onclick="analyticsRange='monthly'; renderActiveModule();" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${analyticsRange==='monthly' ? 'bg-[#8B5CF6] text-white' : 'text-[#94A3B8] hover:text-white'}">Monthly (30D)</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- Bar Chart: Focus Hours Trend (7 Cols) -->
                    <div class="lg:col-span-7 os-card p-5">
                        <h3 class="font-display font-bold text-base text-white mb-1">${analyticsRange === 'weekly' ? '7-Day' : '30-Day'} Study & Productivity Bars</h3>
                        <p class="text-xs text-[#94A3B8] mb-4">Daily productivity index across selected period</p>
                        <div class="flex items-end gap-1.5 h-48 pt-4 px-1">
                            ${scores.map((sc, i) => {
                                const label = dateSlice[i].slice(5);
                                return `
                                    <div class="flex-1 flex flex-col items-center gap-1.5 h-full justify-end group">
                                        <div title="${dateSlice[i]}: Score ${sc}/100" class="w-full rounded-t-md bg-gradient-to-t from-[#8B5CF6] to-[#00D9FF] opacity-85 group-hover:opacity-100 transition-all" style="height:${Math.max(10, sc)}%"></div>
                                        ${analyticsRange === 'weekly' ? `<span class="font-mono text-[10px] text-[#94A3B8]">${label}</span>` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Subject Distribution Donut Chart (5 Cols) -->
                    <div class="lg:col-span-5 os-card p-5 flex flex-col justify-between">
                        <div>
                            <h3 class="font-display font-bold text-base text-white mb-1">Subject Time Distribution</h3>
                            <p class="text-xs text-[#94A3B8] mb-4">Cumulative hours across core subjects</p>
                        </div>
                        <div class="flex flex-col sm:flex-row items-center gap-6 my-auto">
                            <div class="relative w-36 h-36 shrink-0">
                                <svg class="w-full h-full -rotate-90" viewBox="0 0 130 130">
                                    <circle cx="65" cy="65" r="52" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="14" />
                                    ${state.subjects.map(sub => {
                                        const frac = sub.totalHours / totalSubHrs;
                                        const dash = frac * donutCircumference;
                                        const offset = -cumulativePct * donutCircumference;
                                        cumulativePct += frac;
                                        return `<circle cx="65" cy="65" r="52" fill="none" stroke="${sub.color}" stroke-width="14" stroke-dasharray="${dash} ${donutCircumference}" stroke-dashoffset="${offset}" />`;
                                    }).join('')}
                                </svg>
                                <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                                    <span class="font-mono text-base font-bold text-white">${totalSubHrs.toFixed(1)}h</span>
                                    <span class="text-[10px] text-[#94A3B8]">TOTAL</span>
                                </div>
                            </div>
                            <div class="space-y-2.5 flex-1 w-full">
                                ${state.subjects.map(sub => {
                                    const pct = Math.round((sub.totalHours / totalSubHrs) * 100);
                                    return `
                                        <div class="flex items-center justify-between text-xs">
                                            <div class="flex items-center gap-2 min-w-0">
                                                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${sub.color}"></span>
                                                <span class="text-slate-200 truncate">${escapeHTML(sub.name)}</span>
                                            </div>
                                            <span class="font-mono font-bold text-white ml-2">${pct}%</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Achievement Badges Vault -->
                <div class="os-card p-5">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h3 class="font-display font-bold text-base text-white">OS Achievement Badges</h3>
                            <p class="text-xs text-[#94A3B8]">Unlocked milestones: ${badges.filter(b => b.unlocked).length} / ${badges.length}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
                        ${badges.map(b => `
                            <div class="p-4 rounded-2xl border transition ${b.unlocked ? 'bg-[#080B16]/90 border-[#00D9FF]/35 shadow-[0_0_20px_-8px_rgba(0,217,255,0.3)]' : 'bg-[#080B16]/40 border-white/[0.05] opacity-55'}">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full" style="background:${b.color}22; color:${b.color}">${b.unlocked ? 'UNLOCKED' : 'LOCKED'}</span>
                                    <span class="text-sm">${b.unlocked ? '✦' : '🔒'}</span>
                                </div>
                                <h4 class="font-display font-bold text-xs text-white">${b.name}</h4>
                                <p class="text-[11px] text-[#94A3B8] mt-1">${b.desc}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
            `;
        }

        // -------------------------------------------------------------------------
        // MODULE 7: CALENDAR & STREAK VIEW
        // -------------------------------------------------------------------------
        let calendarMonthOffset = 0;

        function renderCalendarView() {
            const base = new Date();
            const viewDate = new Date(base.getFullYear(), base.getMonth() + calendarMonthOffset, 1);
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            const monthTitle = viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const firstWeekday = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const todayISO = getTodayISO();

            const cells = [];
            for (let i = 0; i < firstWeekday; i++) cells.push(null);
            for (let d = 1; d <= daysInMonth; d++) {
                const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                cells.push({ day: d, iso, log: state.history[iso] });
            }

            return `
            <div class="space-y-6 view-enter">
                <div class="os-card p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h2 class="font-display font-bold text-xl gradient-text">${monthTitle}</h2>
                        <p class="text-xs text-[#94A3B8] mt-1">Click any date to inspect logged focus hours & productivity score</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="calendarMonthOffset--; renderActiveModule();" class="min-h-[40px] px-3 py-1.5 rounded-xl bg-white/[0.06] hover:bg-white/[0.12] text-xs font-semibold text-white">&larr; Prev</button>
                        <button onclick="calendarMonthOffset=0; renderActiveModule();" class="min-h-[40px] px-3 py-1.5 rounded-xl bg-[#00D9FF]/15 text-xs font-semibold text-[#00D9FF]">Today</button>
                        <button onclick="calendarMonthOffset++; renderActiveModule();" class="min-h-[40px] px-3 py-1.5 rounded-xl bg-white/[0.06] hover:bg-white/[0.12] text-xs font-semibold text-white">Next &rarr;</button>
                    </div>
                </div>

                <div class="os-card p-5">
                    <div class="grid grid-cols-7 gap-2 text-center font-mono text-xs text-[#94A3B8] pb-3 border-b border-white/[0.07]">
                        <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
                    </div>
                    <div class="grid grid-cols-7 gap-2 mt-3">
                        ${cells.map(c => {
                            if (!c) return `<div class="h-16 sm:h-20 rounded-xl bg-white/[0.01]"></div>`;
                            const isToday = c.iso === todayISO;
                            const hasActivity = Boolean(c.log);
                            return `
                                <button onclick="inspectCalendarDay('${c.iso}')" class="h-16 sm:h-20 p-2 rounded-xl border text-left flex flex-col justify-between transition ${isToday ? 'bg-[#00D9FF]/15 border-[#00D9FF] shadow-[0_0_16px_rgba(0,217,255,0.2)]' : hasActivity ? 'bg-[#10162A] border-[#8B5CF6]/35 hover:border-[#00D9FF]/50' : 'bg-[#080B16]/60 border-white/[0.05] hover:border-white/20'}">
                                    <span class="font-mono text-xs font-bold ${isToday ? 'text-[#00D9FF]' : 'text-white'}">${c.day}</span>
                                    ${hasActivity ? `
                                        <div class="space-y-0.5">
                                            <div class="h-1.5 rounded-full bg-gradient-to-r from-[#00D9FF] to-[#8B5CF6]" style="width:${Math.min(100, c.log.score)}%"></div>
                                            <span class="hidden sm:block font-mono text-[10px] text-[#94A3B8]">${(c.log.focusMinutes/60).toFixed(1)}h</span>
                                        </div>
                                    ` : ''}
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            </div>
            `;
        }

        function inspectCalendarDay(iso) {
            const log = state.history[iso];
            const box = document.getElementById('os-universal-modal-box');
            box.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-display font-bold text-base gradient-text">Telemetry Log: ${escapeHTML(iso)}</h3>
                    <button onclick="closeUniversalModal()" class="text-[#94A3B8] hover:text-white text-lg">✕</button>
                </div>
                ${log ? `
                    <div class="space-y-3 text-xs">
                        <div class="p-3.5 rounded-xl bg-[#080B16] border border-white/[0.08] flex justify-between">
                            <span class="text-[#94A3B8]">Productivity Score</span>
                            <span class="font-mono font-bold text-[#00D9FF]">${log.score} / 100</span>
                        </div>
                        <div class="p-3.5 rounded-xl bg-[#080B16] border border-white/[0.08] flex justify-between">
                            <span class="text-[#94A3B8]">Focused Study Time</span>
                            <span class="font-mono font-bold text-purple-300">${(log.focusMinutes / 60).toFixed(1)} hours (${log.focusMinutes}m)</span>
                        </div>
                        <div class="p-3.5 rounded-xl bg-[#080B16] border border-white/[0.08] flex justify-between">
                            <span class="text-[#94A3B8]">Missions Completed</span>
                            <span class="font-mono font-bold text-emerald-400">${log.tasksCompleted} / ${log.totalTasks}</span>
                        </div>
                    </div>
                ` : `<p class="text-xs text-[#94A3B8] py-4">No archived telemetry recorded for this date.</p>`}
                <div class="mt-5 flex justify-end">
                    <button onclick="closeUniversalModal()" class="btn-os-primary px-4 py-2 text-xs">Close</button>
                </div>
            `;
            openUniversalModal();
        }

        // -------------------------------------------------------------------------

        // -------------------------------------------------------------------------

        function renderNotesView() {

                .filter(n => !notesSearch || n.title.toLowerCase().includes(notesSearch.toLowerCase()) || n.content.toLowerCase().includes(notesSearch.toLowerCase()))
                .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

            return `

            openUniversalModal();
        }

        function saveNoteForm(e, editId) {
            e.preventDefault();
            const title = document.getElementById('note-form-title').value.trim();
            const tag = document.getElementById('note-form-tag').value.trim() || 'Note';
            const color = document.getElementById('note-form-color').value;
            const content = document.getElementById('note-form-content').value.trim();
            if (!title || !content) return;

            if (editId) {
                const idx = state.notes.findIndex(n => n.id === editId);
                if (idx !== -1) state.notes[idx] = { ...state.notes[idx], title, tag, color, content, updatedAt: getTodayISO() };
            } else {
                state.notes.unshift({ id: 'note_' + Date.now(), title, tag, color, content, pinned: false, updatedAt: getTodayISO() });
            }
            saveState();
            closeUniversalModal();
            renderActiveModule();
            showToast('Note saved to vault');
        }

        function togglePinNote(id) {
            const n = state.notes.find(item => item.id === id);
            if (n) { n.pinned = !n.pinned; saveState(); renderActiveModule(); }
        }

        function deleteNoteItem(id) {
            state.notes = state.notes.filter(n => n.id !== id);
            saveState();
            renderActiveModule();
            showToast('Note deleted');
        }

        // -------------------------------------------------------------------------
        // MODULE 9: SYSTEM SETTINGS, FRESH DAY & DATA VAULT
        // -------------------------------------------------------------------------
        function renderSettingsView() {
            return `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 view-enter">
                <!-- Left: OS Preferences (6 Cols) -->
                <div class="lg:col-span-6 os-card p-6">
                    <h2 class="font-display font-bold text-lg gradient-text mb-1">System Preferences</h2>
                    <p class="text-xs text-[#94A3B8] mb-5">Customize SreejithOS 2.0 parameters & audio feedback</p>

                    <form onsubmit="saveSystemSettings(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs text-[#94A3B8] mb-1">OS Operator Name</label>
                            <input id="set-username" type="text" value="${escapeHTML(state.settings.userName)}" required class="os-input w-full px-3.5 py-2.5 text-xs">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs text-[#94A3B8] mb-1">Daily Study Goal (Hours)</label>
                                <input id="set-study-goal" type="number" step="0.5" min="1" max="18" value="${state.settings.dailyStudyGoalHours}" required class="os-input w-full px-3.5 py-2.5 text-xs">
                            </div>
                            <div>
                                <label class="block text-xs text-[#94A3B8] mb-1">Default Focus Duration (Mins)</label>
                                <input id="set-focus-mins" type="number" min="5" max="120" value="${state.settings.focusDurationMins}" required class="os-input w-full px-3.5 py-2.5 text-xs">
                            </div>
                        </div>
                        <label class="flex items-center gap-2.5 text-xs text-slate-200 pt-1 cursor-pointer">
                            <input id="set-sound" type="checkbox" ${state.settings.soundEnabled ? 'checked' : ''} class="accent-[#00D9FF] w-4 h-4">
                            <span>Enable Synthesized Chime on Focus Reactor Completion</span>
                        </label>
                        <button type="submit" class="btn-os-primary min-h-[44px] px-5 py-2.5 text-xs">Save System Settings</button>
                    </form>
                </div>

                <!-- Right: Fresh Day & Backup / Restore Vault (6 Cols) -->
                <div class="lg:col-span-6 space-y-6">
                    <!-- Fresh Day Card -->
                    <div class="os-card p-6 border border-[#00D9FF]/25">
                        <h3 class="font-display font-bold text-base text-white mb-1">Fresh Day Reset System</h3>
                        <p class="text-xs text-[#94A3B8] leading-relaxed mb-4">
                            Archives today's score & study minutes into your Calendar & Analytics history, resets daily subject hours and mission checkboxes, preserves recurring timetable & notes, and increments your streak.
                        </p>
                        <button onclick="openFreshDayModal()" class="btn-os-primary min-h-[44px] px-5 py-2.5 text-xs">Launch Fresh Day Reset</button>
                    </div>

                    <!-- Data Backup & Restore Vault -->
                    <div class="os-card p-6">
                        <h3 class="font-display font-bold text-base text-white mb-1">Data Backup & Restore Vault</h3>
                        <p class="text-xs text-[#94A3B8] mb-4">Export your entire SreejithOS state as JSON or restore from a backup file.</p>
                        <div class="flex flex-wrap gap-3">
                            <button onclick="exportBackupJSON()" class="btn-os-purple min-h-[44px] px-4 py-2.5 text-xs">Download JSON Backup</button>
                            <label class="min-h-[44px] px-4 py-2.5 rounded-xl bg-white/[0.06] hover:bg-white/[0.12] border border-white/[0.1] text-xs font-semibold text-white cursor-pointer flex items-center">
                                <span>Import JSON Backup</span>
                                <input type="file" accept=".json,application/json" onchange="importBackupJSON(event)" class="hidden">
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        function saveSystemSettings(e) {
            e.preventDefault();
            state.settings.userName = document.getElementById('set-username').value.trim() || 'Sreejith Reddy';
            state.settings.dailyStudyGoalHours = parseFloat(document.getElementById('set-study-goal').value) || 6;
            state.settings.focusDurationMins = parseInt(document.getElementById('set-focus-mins').value, 10) || 25;
            state.settings.soundEnabled = document.getElementById('set-sound').checked;

            if (!reactorRunning) {
                reactorSecondsTotal = state.settings.focusDurationMins * 60;
                reactorSecondsLeft = reactorSecondsTotal;
            }
            saveState();
            showToast('System settings updated');
        }

        function exportBackupJSON() {
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `SreejithOS-Backup-${getTodayISO()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Backup JSON downloaded');
        }

        function importBackupJSON(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if (!imported || !Array.isArray(imported.timetable) || !Array.isArray(imported.todos)) {
                        showToast('Invalid SreejithOS backup file');
                        return;
                    }
                    state = { ...createDefaultState(), ...imported };
                    saveState();
                    renderSidebarNav();
                    renderNotifications();
                    renderActiveModule();
                    showToast('Backup restored successfully!');
                } catch (err) {
                    showToast('Failed parsing JSON backup');
                }
            };
            reader.readAsText(file);
        }

        // =========================================================================
        // 9. UNIVERSAL MODAL & FRESH DAY EXECUTION
        // =========================================================================
        function openUniversalModal() {
            const m = document.getElementById('os-universal-modal');
            m.classList.remove('hidden');
            m.classList.add('flex');
        }

        function closeUniversalModal() {
            const m = document.getElementById('os-universal-modal');
            m.classList.add('hidden');
            m.classList.remove('flex');
        }

        function openFreshDayModal() {
            const box = document.getElementById('os-universal-modal-box');
            box.innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-display font-bold text-base gradient-text">Launch Fresh Day Reset?</h3>
                    <button onclick="closeUniversalModal()" class="text-[#94A3B8] hover:text-white text-lg">✕</button>
                </div>
                <p class="text-xs text-[#94A3B8] leading-relaxed mb-4">
                    Ready to start a clean cycle, <strong class="text-white">${escapeHTML(state.settings.userName)}</strong>?
                </p>
                <ul class="text-xs text-slate-300 space-y-2 p-3.5 rounded-xl bg-[#080B16] border border-white/[0.08] mb-5">
                    <li>✓ Archives today's telemetry to Calendar & Analytics</li>
                    <li>✓ Preserves recurring timetable blocks, subjects & notes</li>
                    <li>✓ Resets daily study hours & mission checkboxes</li>
                    <li class="text-[#FF6B81] font-semibold">🔥 Boosts your Streak to ${state.streak.current + 1} Days!</li>
                </ul>
                <div class="flex justify-end gap-2">
                    <button onclick="closeUniversalModal()" class="px-4 py-2.5 rounded-xl bg-white/[0.06] text-xs font-semibold text-slate-300">Cancel</button>
                    <button onclick="executeFreshDayReset()" class="btn-os-primary px-5 py-2.5 text-xs">Confirm Fresh Day</button>
                </div>
            `;
            openUniversalModal();
        }

        function executeFreshDayReset() {
            // 1. Archive current snapshot before resetting
            saveState();
            // 2. Reset daily counters while preserving recurring schedule & cumulative totals
            state.timetable = state.timetable.filter(slot => slot.recurring !== false);
            state.subjects.forEach(sub => { sub.todayHours = 0; });
            state.todos.forEach(t => { t.completed = false; });
            state.streak.current += 1;
            state.streak.best = Math.max(state.streak.best, state.streak.current);
            state.streak.lastActiveDate = getTodayISO();

            saveState();
            closeUniversalModal();
            renderSidebarNav();
            renderActiveModule();
            pushNotification('Fresh Day Initialized', `Streak is now ${state.streak.current} days! Let's execute.`, 'coral');
            showToast(`🌅 Fresh Day Launched! Streak: ${state.streak.current} Days`);
        }

        // =========================================================================
        // 10. BOOT SEQUENCE
        // =========================================================================
        window.addEventListener('DOMContentLoaded', () => {
            tickSystemClock();
            renderSidebarNav();
            renderNotifications();
            switchModule(state.activeModule || 'dashboard');

            setInterval(tickSystemClock, 1000);
            setInterval(() => {
                if (state.activeModule === 'dashboard' || state.activeModule === 'timetable') {
                    renderActiveModule();
                }
            }, 30000);
            window.addEventListener('resize', applySidebarCollapseVisuals);
        });
    </script>
</body>
</html>
